  } else if (scene === 'online') {

function drawBtns() {
  for (const b of btns) {
    if (b.render) { b.render(b); continue; }
    ctx.fillStyle = 'rgba(0,0,0,.35)'; rr(b.x + 3, b.y + 6, b.w, b.h, 18); ctx.fill();
    const g = ctx.createLinearGradient(0, b.y, 0, b.y + b.h); g.addColorStop(0, b.col); g.addColorStop(1, shade(b.col, -30));
    ctx.fillStyle = g; rr(b.x, b.y, b.w, b.h, 18); ctx.fill();
    ctx.strokeStyle = 'rgba(255,255,255,.35)'; ctx.lineWidth = 2; ctx.stroke();
    txt(b.label, b.x + b.w / 2, b.y + b.h / 2 + 1, Math.min(30, b.h * .42), '#fff');
  }
}
function shade(hex, a) { const n = parseInt(hex.slice(1), 16); const f = v => Math.max(0, Math.min(255, v + a)); return 'rgb(' + f(n >> 16) + ',' + f(n >> 8 & 255) + ',' + f(n & 255) + ')'; }

const pauseBtn = { x: W - 42, y: 36, r: 24 }, muteBtn = { x: W - 100, y: 36, r: 24 };
function drawMinimap() {

  ctx.save(); ctx.beginPath(); ctx.rect(mx, my, mw, mh); ctx.clip();
  rocks.forEach(o => { ctx.fillStyle = 'rgba(160,170,180,.7)'; ctx.fillRect(mx + o.x * k - 1.5, my + o.y * k - 1.5, 3, 3); });
  matchas.forEach(m => { ctx.fillStyle = m.gold ? '#ffd84a' : '#9be36b'; ctx.beginPath(); ctx.arc(mx + m.x * k, my + m.y * k, 2.2, 0, 7); ctx.fill(); });
  rivals.forEach(e => { if (e.type === 'queue') return; if (e.type === 'dolmus' && e.st !== 2) return; ctx.fillStyle = '#ff5d5d'; ctx.beginPath(); ctx.arc(mx + e.x * k, my + e.y * k, 3, 0, 7); ctx.fill(); });

  ctx.strokeStyle = 'rgba(255,255,255,.75)'; ctx.lineWidth = 1; ctx.strokeRect(mx + cam.x * k, my + cam.y * k, W * k, H * k);
  ctx.restore();
}
function drawHUD() {
  const lv = LEVELS[L];
  ctx.fillStyle = 'rgba(10,25,15,.62)'; rr(10, 8, W - 20, 62, 16); ctx.fill();

  ctx.fillStyle = can ? '#3fae5a' : '#555a66'; ctx.beginPath(); ctx.arc(dashBtn.x + 40, dashBtn.y - 40, 15, 0, 7); ctx.fill(); ctx.strokeStyle = '#fff'; ctx.lineWidth = 2; ctx.stroke();
  txt(String(wolf.stock), dashBtn.x + 40, dashBtn.y - 39, 17, '#fff', 'center', '900', false);
  // joystick
  if (joyState.id !== null) {
    ctx.fillStyle = 'rgba(255,255,255,.14)'; ctx.beginPath(); ctx.arc(joyState.ox, joyState.oy, 62, 0, 7); ctx.fill(); ctx.strokeStyle = 'rgba(255,255,255,.5)'; ctx.lineWidth = 3; ctx.stroke();
    const dx = joyState.x - joyState.ox, dy = joyState.y - joyState.oy, d = Math.hypot(dx, dy) || 1, m = Math.min(d, 62);
    ctx.fillStyle = 'rgba(255,255,255,.55)'; ctx.beginPath(); ctx.arc(joyState.ox + dx / d * m, joyState.oy + dy / d * m, 28, 0, 7); ctx.fill();
  } else if (time < 12) { txt('Sürükle ya da WASD ile yürü · E = matcha iç, enerji kazan', 400, H - 50, 20, 'rgba(255,255,255,.75)'); }
}

/* ---------- sahneler ---------- */

  txt('Toplam Aura: ' + score, W / 2, 425, 40, '#9be36b');
}
function drawSkins() {

  panel(30, 96, 440, 470);

let bgCache0 = getBG(0);

/* ---------- ana çizim ---------- */
function draw() {
  ctx.save(); ctx.clearRect(0, 0, W, H);
  if (scene === 'menu') drawMenu(); else if (scene === 'skins') drawSkins(); else if (scene === 'cut') drawCut(); else if (['online', 'host', 'join', 'lobbyG', 'netlost'].includes(scene)) drawNet(); else if (scene === 'story') drawStory(); else if (scene === 'final') drawFinal();
  else {
    if (shake > 0) ctx.translate(rand(-5, 5) * shake * 3, rand(-5, 5) * shake * 3);
    updateCam(); ctx.translate(-cam.x, -cam.y);
    ctx.drawImage(bgCache, 0, 0);
    const objs = [];
    rocks.forEach(o => objs.push([o.y, () => drawRock(o)]));
    matchas.forEach(m => objs.push([m.y, () => drawMatcha(m)]));
    if (princess) objs.push([princess.y, () => drawPrincess(princess)]);
    rivals.forEach(e => objs.push([e.y, () => drawRival(e)]));
    players.forEach(P => { if (P.on) objs.push([P.y, () => drawWolf(P)]); });
    objs.sort((a, b) => a[0] - b[0]).forEach(o => o[1]());
    drawHazards();
    parts.forEach(p => { ctx.globalAlpha = Math.max(0, p.life / p.max); if (p.ch) emoji(p.ch, p.x, p.y, p.r * 7); else { ctx.fillStyle = p.col; ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, 7); ctx.fill(); } }); ctx.globalAlpha = 1;
    popups.forEach(p => { ctx.globalAlpha = Math.min(1, p.life * 1.5); txt(p.s, p.x, p.y, 24, p.col); }); ctx.globalAlpha = 1;

/* ---------- girdi ---------- */
function grabFocus() { try { window.focus(); cv.focus({ preventScroll: true }); } catch (_) { } }
grabFocus(); cv.addEventListener('pointerenter', grabFocus); window.addEventListener('load', grabFocus);

function pos(e) { const r = cv.getBoundingClientRect(); return { x: (e.clientX - r.left) * W / r.width, y: (e.clientY - r.top) * H / r.height }; }
cv.addEventListener('pointerdown', e => {
  e.preventDefault(); try { cv.setPointerCapture(e.pointerId); } catch (_) { }
  audioInit(); grabFocus(); const p = pos(e);
  for (const b of btns) if (p.x >= b.x && p.x <= b.x + b.w && p.y >= b.y && p.y <= b.y + b.h) { sfx.ui(); b.fn(); return; }
  if (scene === 'cut') { advanceCut(); return; }
  if (scene !== 'play') return;
  if (dist(p, pauseBtn) < pauseBtn.r + 10) { if (!net.role) paused = !paused; joyState.id = null; return; }
  if (dist(p, muteBtn) < muteBtn.r + 10) { muted = !muted; return; }
  if (paused) return;
  if (dist(p, dashBtn) < dashBtn.r + 14) { doDash(); return; }
  if (joyState.id === null) { joyState.id = e.pointerId; joyState.ox = joyState.x = p.x; joyState.oy = joyState.y = p.y; }
}, { passive: false });
cv.addEventListener('pointermove', e => { if (e.pointerId === joyState.id) { const p = pos(e); joyState.x = p.x; joyState.y = p.y; } });
const endPtr = e => { if (e.pointerId === joyState.id) joyState.id = null; };
cv.addEventListener('pointerup', endPtr); cv.addEventListener('pointercancel', endPtr); cv.addEventListener('lostpointercapture', endPtr);
cv.addEventListener('contextmenu', e => e.preventDefault());
const codeMap = { KeyW: 'w', KeyA: 'a', KeyS: 's', KeyD: 'd', KeyE: 'e', KeyP: 'p', ArrowUp: 'arrowup', ArrowDown: 'arrowdown', ArrowLeft: 'arrowleft', ArrowRight: 'arrowright', Space: ' ' };
function keyOf(e) { return codeMap[e.code] || e.key.toLowerCase(); }
window.addEventListener('keydown', e => {
  const k = keyOf(e); keys[k] = true; audioInit();
  if (scene === 'join') { const u = e.key.toUpperCase(); if (u === 'BACKSPACE') joinCode = joinCode.slice(0, -1); else if (u === 'ENTER') tryJoin(); else if (u.length === 1 && CODE_CH.includes(u) && joinCode.length < 4) joinCode += u; }
  if (scene === 'cut' && !e.repeat && (k === ' ' || k === 'e' || k === 'enter')) advanceCut();
  if ((k === 'e' || k === ' ') && !e.repeat) doDash();
  if (k === 'p' && !e.repeat && scene === 'play' && !net.role) paused = !paused;
  if (k.startsWith('arrow') || k === ' ') e.preventDefault();
});
window.addEventListener('keyup', e => { keys[keyOf(e)] = false; });
window.addEventListener('blur', () => { for (const k in keys) keys[k] = false; });

/* ---------- döngü ---------- */
let last = performance.now();
function loop(now) {
  const dt = Math.min(.05, (now - last) / 1000); last = now;
  if (scene === 'cut' && cut) { const ln = cut.lines[cut.i]; if (cut.c < ln[1].length) { const before = Math.floor(cut.c / 3); cut.c = Math.min(ln[1].length, cut.c + dt * 48); if (Math.floor(cut.c / 3) !== before && ln[0] !== 'narr') beep(ln[0] === 'wolf' ? 210 : 330 + (ln[0].length * 17) % 120, .03, 'square', .02); } }
  if (punch) { punch.t += dt; if (punch.t > .95) punch = null; }
  try {
  if (scene === 'play' || scene === 'over' || scene === 'cleared') { if (scene === 'play') { if (net.role === 'guest') guestUpdate(dt); else update(dt); } else { time += dt; parts.forEach(p => { p.x += p.vx * dt; p.y += p.vy * dt; p.life -= dt; }); parts = parts.filter(p => p.life > 0); } } else time += dt;
  netTick(dt);
  draw();
  } catch (err) { console.error(err); }
  requestAnimationFrame(loop);
}
setBtns(); requestAnimationFrame(loop);
window.__game = { startLevel, get scene() { return scene; }, get got() { return got; }, LEVELS };
