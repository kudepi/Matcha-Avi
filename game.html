<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<style>
  html,body{margin:0;height:100%;background:#0d1a12;overflow:hidden;touch-action:none;
    -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;font-family:system-ui,'Segoe UI',Roboto,sans-serif}
  #wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
  canvas{touch-action:none;display:block;border-radius:14px;box-shadow:0 10px 40px rgba(0,0,0,.55)}
</style>
</head>
<body>
<div id="wrap"><canvas id="c" width="960" height="600"></canvas></div>
<script>
"use strict";
const W = 960, H = 600, FIELD_TOP = 125, FIELD_BOT = H - 24;
const cv = document.getElementById('c');
const ctx = cv.getContext('2d');

/* ---------- ölçekleme ---------- */
function fit() {
  const s = Math.min(window.innerWidth / W, window.innerHeight / H);
  cv.style.width = Math.floor(W * s) + 'px';
  cv.style.height = Math.floor(H * s) + 'px';
}
window.addEventListener('resize', fit); fit();

/* ---------- yardımcılar ---------- */
const rand = (a, b) => a + Math.random() * (b - a);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const dist = (a, b) => Math.hypot(a.x - b.x, a.y - b.y);
function mulberry(seed) { return function () { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function rr(x, y, w, h, r) { ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r); ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath(); }
function txt(s, x, y, size, color, align, weight, shadow) {
  ctx.font = (weight || '800') + ' ' + size + 'px system-ui,"Segoe UI",Roboto,sans-serif';
  ctx.textAlign = align || 'center'; ctx.textBaseline = 'middle';
  if (shadow !== false) { ctx.fillStyle = 'rgba(0,0,0,.55)'; ctx.fillText(s, x + 2, y + 3); }
  ctx.fillStyle = color || '#fff'; ctx.fillText(s, x, y);
}
function wrap(s, x, y, maxW, lh, size, color, align) {
  ctx.font = '600 ' + size + 'px system-ui,"Segoe UI",Roboto,sans-serif';
  const words = s.split(' '); let line = '', yy = y;
  for (const w of words) {
    const t = line ? line + ' ' + w : w;
    if (ctx.measureText(t).width > maxW && line) { txt(line, x, yy, size, color, align, '600', false); line = w; yy += lh; } else line = t;
  }
  txt(line, x, yy, size, color, align, '600', false);
  return yy;
}

/* ---------- ses ---------- */
let audio = null, muted = false;
function audioInit() { if (!audio) { try { audio = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { audio = null; } } if (audio && audio.state === 'suspended') audio.resume(); }
function beep(f, d, type, vol, slide) {
  if (muted || !audio) return;
  const o = audio.createOscillator(), g = audio.createGain();
  o.type = type || 'sine'; o.frequency.value = f;
  if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(30, f + slide), audio.currentTime + d);
  g.gain.value = vol || .08; g.gain.exponentialRampToValueAtTime(.0001, audio.currentTime + d);
  o.connect(g); g.connect(audio.destination); o.start(); o.stop(audio.currentTime + d);
}
const sfx = {
  pick: () => { beep(660, .09, 'triangle', .09); setTimeout(() => beep(990, .12, 'triangle', .09), 70); },
  gold: () => { [660, 880, 1100, 1320].forEach((f, i) => setTimeout(() => beep(f, .12, 'triangle', .09), i * 60)); },
  hurt: () => beep(180, .35, 'sawtooth', .12, -120),
  dash: () => beep(300, .18, 'square', .05, 500),
  warn: () => beep(440, .08, 'square', .03),
  boom: () => beep(120, .4, 'sawtooth', .13, -80),
  win: () => [523, 659, 784, 1047, 1319].forEach((f, i) => setTimeout(() => beep(f, .22, 'triangle', .1), i * 110)),
  lose: () => [400, 330, 260, 190].forEach((f, i) => setTimeout(() => beep(f, .25, 'sawtooth', .09), i * 160)),
  ui: () => beep(520, .07, 'triangle', .07)
};

/* ---------- bölümler ---------- */
const LEVELS = [
  { name: 'Gabar Yamacı', quota: 6, rivals: [], rivalName: null,
    intro: 'Gabar Dağları\'nın eteğinde matcha kasesi dolu. Kurt, prensesi kurtarmak için kaseleri toplamalı. Bu bölümde rakip yok, ısın!',
    win: 'Prenses kurtuldu! "İlk bölümde rakip yoktu, ama bundan sonrası zor," diyor.' },
  { name: 'Sahur Vakti', quota: 8, rivals: ['drummer'], rivalName: 'Tak Tak Sahurcu',
    intro: 'Gecenin bir vakti davulcu uyandı! Tak Tak Sahurcu, davul vurdukça çevresine şok dalgası yayıyor. Dalganın kenarına değme!',
    win: 'Sahurcu davulu kafasına geçirdi. Prenses: "Sahura daha çok var, devam!"' },
  { name: 'Milyarlık Vurgun', quota: 10, rivals: ['fund'], rivalName: 'Kraliçe Vurgun',
    intro: 'Matcha fonuna 2 milyarlık vurgun yapıldı! Kraliçe Vurgun etrafa bozuk para fırlatıyor. Paralar acıtır, kaçın!',
    win: 'Kraliçe Vurgun "fon kapandı" diyerek kaçtı. Prenses: "Hesap sorulacak!"' },
  { name: 'Bombardıman Havuzu', quota: 12, rivals: ['croc'], rivalName: 'Bombardıman Timsahı',
    intro: 'Gökyüzünde uçan Bombardıman Timsahı seni hedef alıyor. Yerdeki kırmızı halka patlama bölgesi, zamanında çık!',
    win: 'Timsah bombasını kendi üstüne düşürdü. Prenses: "Çanta çanta matcha var, bırakma."' },
  { name: 'Kapuçino Balerini', quota: 12, rivals: ['ballerina', 'drummer'], rivalName: 'Kapuçino Balerini + Sahurcu',
    intro: 'Kapuçino Balerini ışınlanıp üstüne atılıyor, Sahurcu da yanında! Balerinin uyarı halkasını görünce sıçra.',
    win: 'Balerin piruetten başı döndü, yere yığıldı. Prenses alkışlıyor.' },
  { name: 'Zam Fırtınası', quota: 14, rivals: ['zam', 'fund'], rivalName: 'Zam Canavarı + Kraliçe Vurgun',
    intro: 'Zam Canavarı fiyat etiketi yağdırıyor! Etiketler peşinden koşuyor ve her geçen saniye artıyor. Hızlı topla!',
    win: 'Zam Canavarı "indirim" kelimesini duyunca patladı. Prenses: "Son bölüm geliyor!"' },
  { name: 'Final: Matcha Mafyası', quota: 16, rivals: ['fund', 'croc', 'ballerina', 'drummer'], rivalName: 'Matcha Mafyası ve Çetesi',
    intro: 'Bütün rakipler birleşti! Davul, para, bomba ve balerin aynı anda. Gabar\'ın kaderi senin pençelerinde, kurt!',
    win: 'Matcha Mafyası dağılmış, Gabar özgür!' }
];

/* ---------- durum ---------- */
let scene = 'menu', btns = [], t0 = 0, time = 0;
let progress = 0, L = 0;
try { progress = +(localStorage.getItem('matchaProg') || 0) || 0; } catch (e) { }
function saveProg() { try { localStorage.setItem('matchaProg', progress); } catch (e) { } }

let wolf, matchas, rocks, rivals, hazards, parts, princess, lives, got, score, inv, shake, bgCache, popups, dashCd, paused = false;
const joyState = { id: null, ox: 0, oy: 0, x: 0, y: 0 };
const keys = {};
const dashBtn = { x: W - 105, y: H - 90, r: 56 };

/* ---------- arka plan ---------- */
function makeBG(level) {
  const c = document.createElement('canvas'); c.width = W; c.height = H; const g = c.getContext('2d');
  const R = mulberry(77 + level * 13);
  const sky = g.createLinearGradient(0, 0, 0, FIELD_TOP + 40);
  const skies = [['#7fc8ff', '#d9f0ff'], ['#1b1f4b', '#4b3a7a'], ['#ffb36b', '#ffe3a8'], ['#5a7aa8', '#c0d2ea'], ['#c88ad8', '#ffd7ec'], ['#6c6f78', '#b9bcc6'], ['#2a0f30', '#8a2b3b']];
  sky.addColorStop(0, skies[level][0]); sky.addColorStop(1, skies[level][1]);
  g.fillStyle = sky; g.fillRect(0, 0, W, H);
  if (level === 1 || level === 6) { g.fillStyle = 'rgba(255,255,255,.85)'; for (let i = 0; i < 40; i++) { g.beginPath(); g.arc(R() * W, R() * 90, R() * 1.6 + .4, 0, 7); g.fill(); } }
  // dağ katmanları
  const layers = [{ y: 105, h: 80, col: '#6f7f96' }, { y: 125, h: 70, col: '#52627a' }, { y: 140, h: 55, col: '#374a3f' }];
  layers.forEach((ly, li) => {
    g.fillStyle = ly.col; g.beginPath(); g.moveTo(0, FIELD_TOP + 60);
    let x = 0; const peaks = [];
    while (x < W + 60) { const px = x + R() * 60 + 30, py = ly.y - R() * ly.h; peaks.push([px, py]); g.lineTo(px, py); x = px + R() * 40 + 30; }
    g.lineTo(W, FIELD_TOP + 60); g.closePath(); g.fill();
    if (li < 2) { g.fillStyle = 'rgba(255,255,255,.9)'; peaks.forEach(p => { if (p[1] < ly.y - ly.h * .45) { g.beginPath(); g.moveTo(p[0], p[1]); g.lineTo(p[0] - 16, p[1] + 20); g.lineTo(p[0] - 4, p[1] + 16); g.lineTo(p[0] + 4, p[1] + 22); g.lineTo(p[0] + 16, p[1] + 19); g.closePath(); g.fill(); } }); }
  });
  // zemin
  const gr = g.createLinearGradient(0, FIELD_TOP, 0, H);
  gr.addColorStop(0, '#4f8a45'); gr.addColorStop(1, '#2f5a30');
  g.fillStyle = gr; g.fillRect(0, FIELD_TOP - 6, W, H);
  for (let i = 0; i < 420; i++) { const x = R() * W, y = FIELD_TOP + R() * (H - FIELD_TOP); g.strokeStyle = 'rgba(20,60,25,' + (.15 + R() * .25) + ')'; g.lineWidth = 1.4; g.beginPath(); g.moveTo(x, y); g.lineTo(x + R() * 4 - 2, y - 5 - R() * 5); g.stroke(); }
  for (let i = 0; i < 25; i++) { const x = R() * W, y = FIELD_TOP + 10 + R() * (H - FIELD_TOP - 20); g.fillStyle = ['#ffe36b', '#fff', '#ff9ec7'][i % 3]; g.beginPath(); g.arc(x, y, 2.2, 0, 7); g.fill(); }
  // çam ağaçları (dekor)
  for (let i = 0; i < 9; i++) { const x = R() * W, y = FIELD_TOP - 4 + R() * 12; g.fillStyle = '#1f4a2a'; g.beginPath(); g.moveTo(x, y - 34); g.lineTo(x - 13, y); g.lineTo(x + 13, y); g.fill(); g.beginPath(); g.moveTo(x, y - 48); g.lineTo(x - 10, y - 20); g.lineTo(x + 10, y - 20); g.fill(); g.fillStyle = '#4a2f1a'; g.fillRect(x - 2, y, 4, 8); }
  // vinyet
  const vg = g.createRadialGradient(W / 2, H / 2, H * .35, W / 2, H / 2, H * .95);
  vg.addColorStop(0, 'rgba(0,0,0,0)'); vg.addColorStop(1, 'rgba(0,0,0,.35)'); g.fillStyle = vg; g.fillRect(0, 0, W, H);
  return c;
}

/* ---------- bölüm başlat ---------- */
function startLevel(i) {
  L = i; const lv = LEVELS[i];
  wolf = { x: 110, y: H - 90, r: 17, dir: 1, dashT: 0, trail: [], face: 1 };
  lives = 3; got = 0; inv = 0; shake = 0; dashCd = 0; matchas = []; rocks = []; rivals = []; hazards = []; parts = []; popups = []; princess = null; paused = false;
  if (i === 0) score = 0;
  bgCache = makeBG(i);
  const R = mulberry(500 + i * 31);
  for (let k = 0; k < 4 + i; k++) {
    for (let tries = 0; tries < 40; tries++) {
      const r = { x: 80 + R() * (W - 160), y: FIELD_TOP + 40 + R() * (FIELD_BOT - FIELD_TOP - 80), r: 20 + R() * 16 };
      if (dist(r, wolf) > 130 && rocks.every(o => dist(o, r) > o.r + r.r + 50)) { rocks.push(r); break; }
    }
  }
  const total = lv.quota + 3;
  for (let k = 0; k < total; k++) spawnMatcha(k % 6 === 5);
  lv.rivals.forEach((t, idx) => {
    const e = { type: t, x: W - 120 - idx * 90, y: FIELD_TOP + 70 + idx * 60, t: rand(0, 2), st: 0, vx: 0, vy: 0, tx: 0, ty: 0, minions: 0, tele: null };
    if (t === 'croc') { e.y = 92; e.vx = 110 + i * 6; e.x = rand(200, 700); }
    if (t === 'fund') { e.tx = e.x; e.ty = e.y; }
    rivals.push(e);
  });
  scene = 'play'; btns = [];
}
function spawnMatcha(gold) {
  for (let tries = 0; tries < 60; tries++) {
    const m = { x: 50 + Math.random() * (W - 100), y: FIELD_TOP + 30 + Math.random() * (FIELD_BOT - FIELD_TOP - 60), gold: !!gold, ph: Math.random() * 6, r: 15 };
    if (rocks.every(o => dist(o, m) > o.r + 28) && matchas.every(o => dist(o, m) > 50) && dist(m, wolf) > 90) { matchas.push(m); return; }
  }
}

/* ---------- oynanış ---------- */
function burst(x, y, col, n) { for (let i = 0; i < n; i++) { const a = Math.random() * 6.28, s = rand(40, 200); parts.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: rand(.3, .8), max: .8, col, r: rand(2, 5) }); } }
function popup(s, x, y, col) { popups.push({ s, x, y, life: 1, col: col || '#fff' }); }
function hurt() {
  if (inv > 0 || wolf.dashT > 0 || scene !== 'play') return;
  lives--; inv = 1.7; shake = .35; sfx.hurt(); burst(wolf.x, wolf.y, '#ff4d5e', 22); popup('Ayy!', wolf.x, wolf.y - 30, '#ff8a95');
  if (lives <= 0) { scene = 'over'; sfx.lose(); setBtns(); }
}
function doDash() {
  if (dashCd > 0 || scene !== 'play' || paused) return;
  dashCd = 1.8; wolf.dashT = .24; sfx.dash();
}
function inputVec() {
  let vx = 0, vy = 0;
  if (joyState.id !== null) { const dx = joyState.x - joyState.ox, dy = joyState.y - joyState.oy, d = Math.hypot(dx, dy); if (d > 6) { const m = Math.min(d / 60, 1); vx = dx / d * m; vy = dy / d * m; } }
  if (keys['arrowleft'] || keys['a']) vx -= 1; if (keys['arrowright'] || keys['d']) vx += 1;
  if (keys['arrowup'] || keys['w']) vy -= 1; if (keys['arrowdown'] || keys['s']) vy += 1;
  const m = Math.hypot(vx, vy); if (m > 1) { vx /= m; vy /= m; }
  return [vx, vy];
}
function update(dt) {
  time += dt; if (paused) return;
  const lv = LEVELS[L];
  // kurt
  const [vx, vy] = inputVec();
  const sp = wolf.dashT > 0 ? 640 : 235;
  wolf.x += vx * sp * dt; wolf.y += vy * sp * dt;
  if (vx > .1) wolf.face = 1; else if (vx < -.1) wolf.face = -1;
  wolf.x = clamp(wolf.x, 24, W - 24); wolf.y = clamp(wolf.y, FIELD_TOP, FIELD_BOT);
  for (const o of rocks) { const d = dist(wolf, o), m = o.r + wolf.r - 4; if (d < m && d > 0) { wolf.x = o.x + (wolf.x - o.x) / d * m; wolf.y = o.y + (wolf.y - o.y) / d * m; } }
  if (wolf.dashT > 0) { wolf.dashT -= dt; wolf.trail.push({ x: wolf.x, y: wolf.y, l: .3 }); }
  wolf.trail.forEach(p => p.l -= dt); wolf.trail = wolf.trail.filter(p => p.l > 0);
  if (dashCd > 0) dashCd -= dt; if (inv > 0) inv -= dt; if (shake > 0) shake -= dt;

  // matcha topla
  for (let i = matchas.length - 1; i >= 0; i--) {
    const m = matchas[i]; if (dist(m, wolf) < m.r + wolf.r + 4) {
      matchas.splice(i, 1); const add = m.gold ? 2 : 1; got += add; score += m.gold ? 300 : 100;
      burst(m.x, m.y, m.gold ? '#ffd84a' : '#9be36b', m.gold ? 26 : 14); popup(m.gold ? '+2 Altın!' : '+1', m.x, m.y - 20, m.gold ? '#ffd84a' : '#d8ffc0');
      m.gold ? sfx.gold() : sfx.pick();
      if (got >= lv.quota && !princess) {
        let px = wolf.x < W / 2 ? W - 100 : 100, py = wolf.y < H / 2 ? H - 80 : FIELD_TOP + 70;
        princess = { x: px, y: py, t: 0 }; popup('Prenses göründü!', W / 2, FIELD_TOP + 20, '#ffe08a'); sfx.win(); burst(px, py, '#ffe08a', 40);
        matchas.length = 0; break;
      }
    }
  }
  if (!princess && matchas.length < lv.quota - got + 1) spawnMatcha(Math.random() < .15);
  if (princess) { princess.t += dt; if (dist(princess, wolf) < 40) { score += lives * 200; scene = 'cleared'; sfx.win(); burst(princess.x, princess.y, '#ffd84a', 60); if (L + 1 > progress) { progress = Math.min(L + 1, LEVELS.length - 1); saveProg(); } setBtns(); } }

  // rakipler
  const lvf = 1 + L * .06;
  for (const e of rivals) {
    e.t += dt;
    if (e.type === 'drummer') {
      const a = Math.atan2(wolf.y - e.y, wolf.x - e.x); e.x += Math.cos(a) * 52 * lvf * dt; e.y += Math.sin(a) * 52 * lvf * dt; e.y = clamp(e.y, FIELD_TOP, FIELD_BOT);
      if (e.t > 3.3) { e.t = 0; hazards.push({ k: 'ring', x: e.x, y: e.y, r: 10, max: 260 }); sfx.warn(); }
      if (dist(e, wolf) < 34) hurt();
    } else if (e.type === 'fund') {
      if (dist(e, { x: e.tx, y: e.ty }) < 12 || e.st === 0) { e.st = 1; e.tx = rand(80, W - 80); e.ty = rand(FIELD_TOP + 30, FIELD_BOT - 40); }
      const a = Math.atan2(e.ty - e.y, e.tx - e.x); e.x += Math.cos(a) * 75 * dt; e.y += Math.sin(a) * 75 * dt;
      if (e.t > 1.7 / lvf) { e.t = 0; const b = Math.atan2(wolf.y - e.y, wolf.x - e.x); hazards.push({ k: 'coin', x: e.x, y: e.y, vx: Math.cos(b) * 235, vy: Math.sin(b) * 235, life: 4 }); sfx.warn(); }
      if (dist(e, wolf) < 34) hurt();
    } else if (e.type === 'croc') {
      e.x += e.vx * dt; if (e.x < 60 || e.x > W - 60) e.vx *= -1; e.y = 92 + Math.sin(time * 2) * 10;
      if (e.t > 2.6 / lvf) { e.t = 0; hazards.push({ k: 'bomb', x: wolf.x + rand(-30, 30), y: wolf.y + rand(-30, 30), t: 0, fuse: 1.35, r: 72 }); sfx.warn(); }
    } else if (e.type === 'ballerina') {
      if (e.st === 0) { const a = Math.atan2(wolf.y - e.y, wolf.x - e.x); e.x += Math.cos(a) * 55 * dt; e.y += Math.sin(a) * 55 * dt; if (e.t > 3.4) { e.st = 1; e.t = 0; const ang = Math.random() * 6.28; e.tele = { x: clamp(wolf.x + Math.cos(ang) * 190, 40, W - 40), y: clamp(wolf.y + Math.sin(ang) * 190, FIELD_TOP + 10, FIELD_BOT) }; sfx.warn(); } }
      else if (e.st === 1) { if (e.t > .9) { e.x = e.tele.x; e.y = e.tele.y; e.st = 2; e.t = 0; const a = Math.atan2(wolf.y - e.y, wolf.x - e.x); e.vx = Math.cos(a) * 390; e.vy = Math.sin(a) * 390; e.tele = null; sfx.dash(); } }
      else if (e.st === 2) { e.x += e.vx * dt; e.y += e.vy * dt; e.x = clamp(e.x, 20, W - 20); e.y = clamp(e.y, FIELD_TOP, FIELD_BOT); if (e.t > .65) { e.st = 0; e.t = 0; } }
      if (dist(e, wolf) < 32) hurt();
    } else if (e.type === 'zam') {
      e.x = W / 2 + Math.sin(time * .6) * 330; e.y = 90 + Math.sin(time * 1.3) * 12;
      if (e.t > 3.4 && e.minions < 6) { e.t = 0; e.minions++; hazards.push({ k: 'tag', x: e.x, y: e.y + 20, life: 13, own: e, v: 0 }); sfx.warn(); }
    }
  }
  // tehlikeler
  for (const h of hazards) {
    if (h.k === 'ring') { h.r += 150 * dt; if (Math.abs(dist(h, wolf) - h.r) < 12) hurt(); if (h.r > h.max) h.dead = true; }
    else if (h.k === 'coin') { h.x += h.vx * dt; h.y += h.vy * dt; h.life -= dt; if (h.life <= 0 || h.x < -20 || h.x > W + 20 || h.y < 60 || h.y > H + 20) h.dead = true; if (dist(h, wolf) < 22) { hurt(); h.dead = true; } }
    else if (h.k === 'bomb') { h.t += dt; if (h.t >= h.fuse && !h.boom) { h.boom = .35; sfx.boom(); shake = .2; burst(h.x, h.y, '#ffb347', 28); if (dist(h, wolf) < h.r + wolf.r - 6) hurt(); } if (h.boom) { h.boom -= dt; if (h.boom <= 0) h.dead = true; } }
    else if (h.k === 'tag') { h.life -= dt; h.v = Math.min(h.v + 22 * dt, 175); const a = Math.atan2(wolf.y - h.y, wolf.x - h.x); h.x += Math.cos(a) * (70 + h.v) * dt; h.y += Math.sin(a) * (70 + h.v) * dt; h.y = Math.max(h.y, FIELD_TOP - 20); if (dist(h, wolf) < 24) { hurt(); h.life = 0; } if (h.life <= 0) { h.dead = true; h.own.minions--; } }
  }
  hazards = hazards.filter(h => !h.dead);
  parts.forEach(p => { p.x += p.vx * dt; p.y += p.vy * dt; p.vx *= .93; p.vy *= .93; p.life -= dt; }); parts = parts.filter(p => p.life > 0);
  popups.forEach(p => { p.y -= 34 * dt; p.life -= dt; }); popups = popups.filter(p => p.life > 0);
}

/* ---------- çizim: nesneler ---------- */
function shadow(x, y, w) { ctx.fillStyle = 'rgba(0,0,0,.28)'; ctx.beginPath(); ctx.ellipse(x, y + 18, w, w * .35, 0, 0, 7); ctx.fill(); }
function drawRock(o) {
  shadow(o.x, o.y - 6, o.r * 1.1);
  const g = ctx.createRadialGradient(o.x - o.r * .3, o.y - o.r * .4, 3, o.x, o.y, o.r * 1.1);
  g.addColorStop(0, '#b5bcc4'); g.addColorStop(1, '#5d646e'); ctx.fillStyle = g;
  ctx.beginPath(); for (let i = 0; i < 9; i++) { const a = i / 9 * 6.283, rr2 = o.r * (.88 + .18 * Math.sin(i * 2.7 + o.x)); const px = o.x + Math.cos(a) * rr2, py = o.y + Math.sin(a) * rr2 * .85; i ? ctx.lineTo(px, py) : ctx.moveTo(px, py); } ctx.closePath(); ctx.fill();
  ctx.strokeStyle = 'rgba(0,0,0,.3)'; ctx.lineWidth = 2; ctx.stroke();
}
function drawMatcha(m) {
  const b = Math.sin(time * 3 + m.ph) * 3; const x = m.x, y = m.y + b;
  shadow(m.x, m.y - 2, 15);
  const glow = ctx.createRadialGradient(x, y, 2, x, y, 30); glow.addColorStop(0, m.gold ? 'rgba(255,216,74,.55)' : 'rgba(170,255,120,.45)'); glow.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = glow; ctx.beginPath(); ctx.arc(x, y, 30, 0, 7); ctx.fill();
  // kase
  ctx.fillStyle = m.gold ? '#c99a1d' : '#8b5a33'; ctx.beginPath(); ctx.ellipse(x, y + 4, 16, 12, 0, 0, Math.PI); ctx.fill();
  ctx.fillStyle = m.gold ? '#ffd84a' : '#a56a3c'; ctx.beginPath(); ctx.ellipse(x, y + 1, 16, 7, 0, 0, 7); ctx.fill();
  const g = ctx.createRadialGradient(x - 3, y - 1, 1, x, y, 13); g.addColorStop(0, '#c6f08a'); g.addColorStop(1, '#5d9e3a');
  ctx.fillStyle = g; ctx.beginPath(); ctx.ellipse(x, y, 13, 5.5, 0, 0, 7); ctx.fill();
  ctx.fillStyle = 'rgba(255,255,255,.55)'; ctx.beginPath(); ctx.ellipse(x - 4, y - 1, 3, 1.2, 0, 0, 7); ctx.fill();
  if (m.gold) { txt('★', x, y - 18, 14, '#fff3b0', 'center', '900', false); }
}
function drawWolf() {
  wolf.trail.forEach(p => { ctx.globalAlpha = p.l / .3 * .35; ctx.fillStyle = '#cfe6ff'; ctx.beginPath(); ctx.arc(p.x, p.y, 15, 0, 7); ctx.fill(); }); ctx.globalAlpha = 1;
  if (inv > 0 && Math.floor(time * 14) % 2 === 0 && wolf.dashT <= 0) return;
  shadow(wolf.x, wolf.y, 18);
  ctx.save(); ctx.translate(wolf.x, wolf.y); if (wolf.face < 0) ctx.scale(-1, 1);
  const bob = Math.sin(time * 14) * ((inputVec()[0] || inputVec()[1]) ? 1.5 : 0);
  ctx.font = '40px "Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.scale(-1, 1); ctx.fillText('🐺', 0, bob); ctx.restore();
}
function drawPrincess(p) {
  const bob = Math.sin(p.t * 3) * 3, x = p.x, y = p.y + bob;
  const aura = ctx.createRadialGradient(x, y, 5, x, y, 70); aura.addColorStop(0, 'rgba(255,224,138,.6)'); aura.addColorStop(1, 'rgba(255,224,138,0)');
  ctx.fillStyle = aura; ctx.beginPath(); ctx.arc(x, y, 70, 0, 7); ctx.fill();
  shadow(p.x, p.y + 6, 24);
  // elbise
  const dg = ctx.createLinearGradient(x, y, x, y + 40); dg.addColorStop(0, '#d94fa0'); dg.addColorStop(1, '#7b2d8e');
  ctx.fillStyle = dg; ctx.beginPath(); ctx.moveTo(x - 9, y + 4); ctx.quadraticCurveTo(x - 30, y + 26, x - 28, y + 40); ctx.lineTo(x + 28, y + 40); ctx.quadraticCurveTo(x + 30, y + 26, x + 9, y + 4); ctx.closePath(); ctx.fill();
  ctx.fillStyle = '#ffd84a'; ctx.fillRect(x - 10, y + 10, 20, 4);
  // örgüler
  ctx.strokeStyle = '#1a0f0a'; ctx.lineWidth = 5; ctx.lineCap = 'round';
  for (let i = -3; i <= 3; i++) { const bx = x + i * 5.5, sw = Math.sin(p.t * 2.2 + i) * 3; ctx.beginPath(); ctx.moveTo(bx, y - 16); ctx.quadraticCurveTo(bx + i * 3 + sw, y + 8, bx + i * 5 + sw, y + 28); ctx.stroke(); ctx.fillStyle = ['#ffd84a', '#ff6fa5', '#6fe3ff'][(i + 3) % 3]; ctx.beginPath(); ctx.arc(bx + i * 5 + sw, y + 28, 3, 0, 7); ctx.fill(); }
  // saç tacı
  ctx.fillStyle = '#1a0f0a'; ctx.beginPath(); ctx.arc(x, y - 14, 15, Math.PI, 0); ctx.fill();
  // yüz
  const fg = ctx.createRadialGradient(x - 3, y - 14, 2, x, y - 10, 14); fg.addColorStop(0, '#8a5a3a'); fg.addColorStop(1, '#5e3a22');
  ctx.fillStyle = fg; ctx.beginPath(); ctx.ellipse(x, y - 9, 11, 12, 0, 0, 7); ctx.fill();
  ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(x - 4, y - 11, 2.2, 0, 7); ctx.arc(x + 4, y - 11, 2.2, 0, 7); ctx.fill();
  ctx.fillStyle = '#1a0f0a'; ctx.beginPath(); ctx.arc(x - 4, y - 11, 1.1, 0, 7); ctx.arc(x + 4, y - 11, 1.1, 0, 7); ctx.fill();
  ctx.strokeStyle = '#2b130b'; ctx.lineWidth = 1.5; ctx.beginPath(); ctx.arc(x, y - 6, 4, .2, Math.PI - .2); ctx.stroke();
  // taç
  ctx.fillStyle = '#ffd84a'; ctx.beginPath(); ctx.moveTo(x - 11, y - 20); ctx.lineTo(x - 11, y - 31); ctx.lineTo(x - 5, y - 25); ctx.lineTo(x, y - 34); ctx.lineTo(x + 5, y - 25); ctx.lineTo(x + 11, y - 31); ctx.lineTo(x + 11, y - 20); ctx.closePath(); ctx.fill();
  ctx.strokeStyle = '#b98a10'; ctx.lineWidth = 1.5; ctx.stroke();
  ctx.fillStyle = '#ff4d6d'; ctx.beginPath(); ctx.arc(x, y - 24, 2.4, 0, 7); ctx.fill();
  txt('PRENSES', x, y - 52, 15, '#ffe9a8');
}
function emoji(ch, x, y, size) { ctx.font = size + 'px "Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillStyle = '#fff'; ctx.fillText(ch, x, y); }
function drawRival(e) {
  const map = { drummer: ['🥁', 'Tak Tak Sahurcu'], fund: ['💸', 'Kraliçe Vurgun'], croc: ['🐊', 'Bombardıman'], ballerina: ['🩰', 'Kapuçino Balerin'], zam: ['🏷️', 'Zam Canavarı'] };
  const [ch, name] = map[e.type];
  if (e.type === 'ballerina' && e.tele) { const k = e.t / .9; ctx.strokeStyle = 'rgba(255,90,140,.9)'; ctx.lineWidth = 4; ctx.setLineDash([8, 6]); ctx.beginPath(); ctx.arc(e.tele.x, e.tele.y, 34 - k * 10, 0, 7); ctx.stroke(); ctx.setLineDash([]); emoji('⚠️', e.tele.x, e.tele.y, 22); }
  if (e.type !== 'croc' && e.type !== 'zam') shadow(e.x, e.y, 22);
  ctx.save(); ctx.translate(e.x, e.y);
  if (e.type === 'ballerina' && e.st === 2) ctx.rotate(time * 18);
  if (e.type === 'drummer') ctx.rotate(Math.sin(time * 9) * .12);
  const big = e.type === 'zam' ? 62 : e.type === 'croc' ? 54 : 44;
  emoji(ch, 0, 0, big); ctx.restore();
  if (e.type === 'drummer' && e.t > 2.4) { ctx.strokeStyle = 'rgba(255,255,255,.7)'; ctx.lineWidth = 3; ctx.beginPath(); ctx.arc(e.x, e.y, 28 + (e.t - 2.4) * 22, 0, 7); ctx.stroke(); }
  txt(name, e.x, e.y - 38, 13, '#ffd0d0');
}
function drawHazards() {
  for (const h of hazards) {
    if (h.k === 'ring') { ctx.strokeStyle = 'rgba(255,255,255,.9)'; ctx.lineWidth = 7; ctx.beginPath(); ctx.arc(h.x, h.y, h.r, 0, 7); ctx.stroke(); ctx.strokeStyle = 'rgba(255,80,80,.8)'; ctx.lineWidth = 3; ctx.beginPath(); ctx.arc(h.x, h.y, h.r, 0, 7); ctx.stroke(); }
    else if (h.k === 'coin') { ctx.save(); ctx.translate(h.x, h.y); ctx.rotate(time * 10); ctx.fillStyle = '#ffd84a'; ctx.beginPath(); ctx.ellipse(0, 0, 10, Math.abs(Math.cos(time * 8)) * 10 + 2, 0, 0, 7); ctx.fill(); ctx.strokeStyle = '#a77b00'; ctx.lineWidth = 2; ctx.stroke(); ctx.restore(); }
    else if (h.k === 'bomb') {
      if (!h.boom) { const k = h.t / h.fuse; ctx.fillStyle = 'rgba(255,60,60,' + (.15 + .25 * Math.abs(Math.sin(time * 12))) + ')'; ctx.beginPath(); ctx.arc(h.x, h.y, h.r, 0, 7); ctx.fill(); ctx.strokeStyle = 'rgba(255,80,80,.95)'; ctx.lineWidth = 3; ctx.setLineDash([10, 7]); ctx.stroke(); ctx.setLineDash([]); ctx.fillStyle = 'rgba(255,120,60,.5)'; ctx.beginPath(); ctx.arc(h.x, h.y, h.r * k, 0, 7); ctx.fill(); emoji('💣', h.x, h.y - 6 + (1 - k) * -30, 26); }
      else { const k = h.boom / .35; const g = ctx.createRadialGradient(h.x, h.y, 5, h.x, h.y, h.r); g.addColorStop(0, 'rgba(255,255,200,' + k + ')'); g.addColorStop(.5, 'rgba(255,140,40,' + k * .9 + ')'); g.addColorStop(1, 'rgba(200,40,0,0)'); ctx.fillStyle = g; ctx.beginPath(); ctx.arc(h.x, h.y, h.r, 0, 7); ctx.fill(); }
    }
    else if (h.k === 'tag') { ctx.save(); ctx.translate(h.x, h.y); ctx.rotate(Math.sin(time * 8 + h.life) * .2); ctx.fillStyle = '#e8294a'; rr(-17, -11, 34, 22, 5); ctx.fill(); ctx.strokeStyle = '#fff'; ctx.lineWidth = 2; ctx.stroke(); txt('ZAM', 0, 1, 11, '#fff', 'center', '900', false); ctx.restore(); }
  }
}

    B(W / 2 - 170, progress > 0 ? 492 : 420, 340, 56, muted ? '🔇  SES KAPALI' : '🔊  SES AÇIK', () => { muted = !muted; setBtns(); }, '#6a5a8a');

    // oyun içi düğmeleri HUD çiziyor
  }

function drawBtns() {
  for (const b of btns) {
    ctx.fillStyle = 'rgba(0,0,0,.35)'; rr(b.x + 3, b.y + 6, b.w, b.h, 18); ctx.fill();
    const g = ctx.createLinearGradient(0, b.y, 0, b.y + b.h); g.addColorStop(0, b.col); g.addColorStop(1, shade(b.col, -30));
    ctx.fillStyle = g; rr(b.x, b.y, b.w, b.h, 18); ctx.fill();
    ctx.strokeStyle = 'rgba(255,255,255,.35)'; ctx.lineWidth = 2; ctx.stroke();
    txt(b.label, b.x + b.w / 2, b.y + b.h / 2 + 1, Math.min(30, b.h * .42), '#fff');
  }
}
function shade(hex, a) { const n = parseInt(hex.slice(1), 16); const f = v => Math.max(0, Math.min(255, v + a)); return 'rgb(' + f(n >> 16) + ',' + f(n >> 8 & 255) + ',' + f(n & 255) + ')'; }

const pauseBtn = { x: W - 42, y: 36, r: 24 }, muteBtn = { x: W - 100, y: 36, r: 24 };

  txt('Bölüm ' + (L + 1) + ' · ' + lv.name, W / 2, 24, 22, '#fff');
  const bw = 320, bx = W / 2 - bw / 2, by = 44; ctx.fillStyle = 'rgba(255,255,255,.18)'; rr(bx, by, bw, 16, 8); ctx.fill();
  const k = Math.min(1, got / lv.quota); if (k > 0) { const g = ctx.createLinearGradient(bx, 0, bx + bw, 0); g.addColorStop(0, '#9be36b'); g.addColorStop(1, '#3fae5a'); ctx.fillStyle = g; rr(bx, by, Math.max(16, bw * k), 16, 8); ctx.fill(); }

  if (princess) { const a = Math.atan2(princess.y - wolf.y, princess.x - wolf.x); ctx.save(); ctx.translate(wolf.x + Math.cos(a) * 44, wolf.y + Math.sin(a) * 44); ctx.rotate(a); ctx.fillStyle = '#ffe08a'; ctx.beginPath(); ctx.moveTo(10, 0); ctx.lineTo(-6, -8); ctx.lineTo(-6, 8); ctx.closePath(); ctx.fill(); ctx.restore(); txt('Prenses\'e git!', W / 2, FIELD_TOP + 14, 22, '#ffe08a'); }
  // dash düğmesi

  ctx.strokeStyle = ready ? '#ffd84a' : 'rgba(255,255,255,.35)'; ctx.lineWidth = 5; ctx.stroke();
  if (!ready) { ctx.strokeStyle = '#ffd84a'; ctx.beginPath(); ctx.arc(dashBtn.x, dashBtn.y, dashBtn.r, -Math.PI / 2, -Math.PI / 2 + (1 - dashCd / 1.8) * 6.283); ctx.stroke(); }

    const dx = joyState.x - joyState.ox, dy = joyState.y - joyState.oy, d = Math.hypot(dx, dy) || 1, m = Math.min(d, 62);
    ctx.fillStyle = 'rgba(255,255,255,.55)'; ctx.beginPath(); ctx.arc(joyState.ox + dx / d * m, joyState.oy + dy / d * m, 28, 0, 7); ctx.fill();
  } else if (time < 12) { txt('Parmağını sürükle ya da WASD ile yürü · E = atılım', 250, H - 50, 20, 'rgba(255,255,255,.75)'); }
}

let bgCache0 = makeBG(0);

/* ---------- ana çizim ---------- */
function draw() {
  ctx.save(); ctx.clearRect(0, 0, W, H);
  if (scene === 'menu') drawMenu(); else if (scene === 'story') drawStory(); else if (scene === 'final') drawFinal();
  else {
    if (shake > 0) ctx.translate(rand(-5, 5) * shake * 3, rand(-5, 5) * shake * 3);
    ctx.drawImage(bgCache, 0, 0);
    const objs = [];
    rocks.forEach(o => objs.push([o.y, () => drawRock(o)]));
    matchas.forEach(m => objs.push([m.y, () => drawMatcha(m)]));
    if (princess) objs.push([princess.y, () => drawPrincess(princess)]);
    rivals.forEach(e => objs.push([e.y, () => drawRival(e)]));
    objs.push([wolf.y, drawWolf]);
    objs.sort((a, b) => a[0] - b[0]).forEach(o => o[1]());
    drawHazards();
    parts.forEach(p => { ctx.globalAlpha = Math.max(0, p.life / p.max); ctx.fillStyle = p.col; ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, 7); ctx.fill(); }); ctx.globalAlpha = 1;
    popups.forEach(p => { ctx.globalAlpha = Math.min(1, p.life * 1.5); txt(p.s, p.x, p.y, 24, p.col); }); ctx.globalAlpha = 1;
    ctx.restore(); ctx.save();
    drawHUD();
    if (paused) { ctx.fillStyle = 'rgba(0,0,0,.55)'; ctx.fillRect(0, 0, W, H); txt('DURAKLATILDI', W / 2, H / 2 - 20, 64, '#fff', 'center', '900'); txt('Devam için ❚❚ düğmesine dokun', W / 2, H / 2 + 40, 24, '#cde'); }
    if (scene === 'over') drawOver(); if (scene === 'cleared') drawCleared();
  }
  drawBtns(); ctx.restore();
}

/* ---------- girdi ---------- */
function pos(e) { const r = cv.getBoundingClientRect(); return { x: (e.clientX - r.left) * W / r.width, y: (e.clientY - r.top) * H / r.height }; }
cv.addEventListener('pointerdown', e => {
  e.preventDefault(); try { cv.setPointerCapture(e.pointerId); } catch (_) { }
  audioInit(); const p = pos(e);
  for (const b of btns) if (p.x >= b.x && p.x <= b.x + b.w && p.y >= b.y && p.y <= b.y + b.h) { sfx.ui(); b.fn(); return; }
  if (scene !== 'play') return;
  if (dist(p, pauseBtn) < pauseBtn.r + 10) { paused = !paused; joyState.id = null; return; }
  if (dist(p, muteBtn) < muteBtn.r + 10) { muted = !muted; return; }
  if (paused) return;
  if (dist(p, dashBtn) < dashBtn.r + 14) { doDash(); return; }
  if (joyState.id === null) { joyState.id = e.pointerId; joyState.ox = joyState.x = p.x; joyState.oy = joyState.y = p.y; }
}, { passive: false });
cv.addEventListener('pointermove', e => { if (e.pointerId === joyState.id) { const p = pos(e); joyState.x = p.x; joyState.y = p.y; } });
const endPtr = e => { if (e.pointerId === joyState.id) joyState.id = null; };
cv.addEventListener('pointerup', endPtr); cv.addEventListener('pointercancel', endPtr); cv.addEventListener('lostpointercapture', endPtr);
cv.addEventListener('contextmenu', e => e.preventDefault());
const codeMap = { KeyW: 'w', KeyA: 'a', KeyS: 's', KeyD: 'd', KeyE: 'e', KeyP: 'p', ArrowUp: 'arrowup', ArrowDown: 'arrowdown', ArrowLeft: 'arrowleft', ArrowRight: 'arrowright', Space: ' ' };
function keyOf(e) { return codeMap[e.code] || e.key.toLowerCase(); }
window.addEventListener('keydown', e => {
  const k = keyOf(e); keys[k] = true; audioInit();
  if ((k === 'e' || k === ' ') && !e.repeat) doDash();
  if (k === 'p' && !e.repeat && scene === 'play') paused = !paused;
  if (k.startsWith('arrow') || k === ' ') e.preventDefault();
});
window.addEventListener('keyup', e => { keys[keyOf(e)] = false; });
window.addEventListener('blur', () => { for (const k in keys) keys[k] = false; });

/* ---------- döngü ---------- */
let last = performance.now();
function loop(now) {
  const dt = Math.min(.05, (now - last) / 1000); last = now;
  try {
  if (scene === 'play' || scene === 'over' || scene === 'cleared') { if (scene === 'play') update(dt); else { time += dt; parts.forEach(p => { p.x += p.vx * dt; p.y += p.vy * dt; p.life -= dt; }); parts = parts.filter(p => p.life > 0); } } else time += dt;
  draw();
  } catch (err) { console.error(err); }
  requestAnimationFrame(loop);
}
setBtns(); requestAnimationFrame(loop);
window.__game = { startLevel, get scene() { return scene; }, get got() { return got; }, LEVELS };
