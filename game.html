/* ---------- ölçekleme ---------- */
function fit() {
  const s = Math.min(window.innerWidth / W, window.innerHeight / H);
  cv.style.width = Math.floor(W * s) + 'px';
  cv.style.height = Math.floor(H * s) + 'px';
}
window.addEventListener('resize', fit); fit();

function rr(x, y, w, h, r) { ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r); ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath(); }
function txt(s, x, y, size, color, align, weight, shadow) {
  ctx.font = (weight || '800') + ' ' + size + 'px system-ui,"Segoe UI",Roboto,sans-serif';
  ctx.textAlign = align || 'center'; ctx.textBaseline = 'middle';
  if (shadow !== false) { ctx.fillStyle = 'rgba(0,0,0,.55)'; ctx.fillText(s, x + 2, y + 3); }
  ctx.fillStyle = color || '#fff'; ctx.fillText(s, x, y);
}
function wrap(s, x, y, maxW, lh, size, color, align) {
  ctx.font = '600 ' + size + 'px system-ui,"Segoe UI",Roboto,sans-serif';
  const words = s.split(' '); let line = '', yy = y;
  for (const w of words) {
    const t = line ? line + ' ' + w : w;
    if (ctx.measureText(t).width > maxW && line) { txt(line, x, yy, size, color, align, '600', false); line = w; yy += lh; } else line = t;
  }
  txt(line, x, yy, size, color, align, '600', false);
  return yy;
}

let audio = null, muted = false;
function audioInit() { if (!audio) { try { audio = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { audio = null; } } if (audio && audio.state === 'suspended') audio.resume(); }
function beep(f, d, type, vol, slide) {
  if (muted || !audio) return;
  const o = audio.createOscillator(), g = audio.createGain();
  o.type = type || 'sine'; o.frequency.value = f;
  if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(30, f + slide), audio.currentTime + d);
  g.gain.value = vol || .08; g.gain.exponentialRampToValueAtTime(.0001, audio.currentTime + d);
  o.connect(g); g.connect(audio.destination); o.start(); o.stop(audio.currentTime + d);
}

  hurt: () => {

    const g = audio.createGain(); g.gain.value = .35; src.connect(bp); bp.connect(g); g.connect(audio.destination); src.start();

/* ---------- ana çizim ---------- */
function draw() {
  ctx.save(); ctx.clearRect(0, 0, W, H);
  if (scene === 'menu') drawMenu(); else if (scene === 'skins') drawSkins(); else if (scene === 'cut') drawCut(); else if (['online', 'host', 'join', 'lobbyG', 'netlost', 'nick'].includes(scene)) drawNet(); else if (scene === 'story') drawStory(); else if (scene === 'final') drawFinal();
  else {
    if (shake > 0) ctx.translate(rand(-5, 5) * shake * 3, rand(-5, 5) * shake * 3);
    updateCam(); ctx.translate(-cam.x, -cam.y);
    ctx.drawImage(bgCache, cam.x, cam.y, W, H, cam.x, cam.y, W, H);
    const objs = [], vx0 = cam.x - 90, vx1 = cam.x + W + 90, vy0 = cam.y - 90, vy1 = cam.y + H + 90, vis = o => o.x > vx0 && o.x < vx1 && o.y > vy0 && o.y < vy1;
    rocks.forEach(o => { if (vis(o)) objs.push([o.y, () => drawRock(o)]); });
    matchas.forEach(m => { if (vis(m)) objs.push([m.y, () => drawMatcha(m)]); });
    if (princess) objs.push([princess.y, () => drawPrincess(princess)]);
    rivals.forEach(e => { if (e.type === 'queue' || e.type === 'dolmus' || vis(e)) objs.push([e.y, () => drawRival(e)]); });
    players.forEach(P => { if (P.on) objs.push([P.y, () => drawWolf(P)]); });
    objs.sort((a, b) => a[0] - b[0]).forEach(o => o[1]());
    drawHazards();
    parts.forEach(p => { if (!vis(p)) return; ctx.globalAlpha = Math.max(0, p.life / p.max); if (p.ch) emoji(p.ch, p.x, p.y, p.r * 7); else { ctx.fillStyle = p.col; ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, 7); ctx.fill(); } }); ctx.globalAlpha = 1;
    popups.forEach(p => { ctx.globalAlpha = Math.min(1, p.life * 1.5); txt(p.s, p.x, p.y, 24, p.col); }); ctx.globalAlpha = 1;
    ctx.restore(); ctx.save();
    drawPunch();
    drawHUD();
    if (paused) { ctx.fillStyle = 'rgba(0,0,0,.55)'; ctx.fillRect(0, 0, W, H); txt('DURAKLATILDI', W / 2, H / 2 - 20, 64, '#fff', 'center', '900'); txt('Devam için ❚❚ düğmesine dokun', W / 2, H / 2 + 40, 24, '#cde'); }
    if (scene === 'over') drawOver(); if (scene === 'cleared') drawCleared();
  }
  drawBtns(); ctx.restore();
}

/* ---------- girdi ---------- */
function grabFocus() { try { window.focus(); cv.focus({ preventScroll: true }); } catch (_) { } }
grabFocus(); cv.addEventListener('pointerenter', grabFocus); window.addEventListener('load', grabFocus);

function pos(e) { const r = cv.getBoundingClientRect(); return { x: (e.clientX - r.left) * W / r.width, y: (e.clientY - r.top) * H / r.height }; }
cv.addEventListener('pointerdown', e => {
  e.preventDefault(); try { cv.setPointerCapture(e.pointerId); } catch (_) { }
  audioInit(); grabFocus(); const p = pos(e);
  for (const b of btns) if (p.x >= b.x && p.x <= b.x + b.w && p.y >= b.y && p.y <= b.y + b.h) { sfx.ui(); b.fn(); return; }
  if (scene === 'cut') { advanceCut(); return; }
  if (scene !== 'play') return;
  if (dist(p, pauseBtn) < pauseBtn.r + 10) { if (!net.role) paused = !paused; joyState.id = null; return; }
  if (dist(p, muteBtn) < muteBtn.r + 10) { muted = !muted; return; }
  if (paused) return;
  if (dist(p, dashBtn) < dashBtn.r + 14) { doDash(); return; }
  if (joyState.id === null) { joyState.id = e.pointerId; joyState.ox = joyState.x = p.x; joyState.oy = joyState.y = p.y; }
}, { passive: false });
cv.addEventListener('pointermove', e => { if (e.pointerId === joyState.id) { const p = pos(e); joyState.x = p.x; joyState.y = p.y; } });
const endPtr = e => { if (e.pointerId === joyState.id) joyState.id = null; };
cv.addEventListener('pointerup', endPtr); cv.addEventListener('pointercancel', endPtr); cv.addEventListener('lostpointercapture', endPtr);
cv.addEventListener('contextmenu', e => e.preventDefault());
const codeMap = { KeyW: 'w', KeyA: 'a', KeyS: 's', KeyD: 'd', KeyE: 'e', KeyP: 'p', ArrowUp: 'arrowup', ArrowDown: 'arrowdown', ArrowLeft: 'arrowleft', ArrowRight: 'arrowright', Space: ' ' };
function keyOf(e) { return codeMap[e.code] || e.key.toLowerCase(); }
window.addEventListener('keydown', e => {
  const k = keyOf(e); keys[k] = true; audioInit();
  if (scene === 'join') { const u = e.key.toUpperCase(); if (u === 'BACKSPACE') joinCode = joinCode.slice(0, -1); else if (u === 'ENTER') tryJoin(); else if (u.length === 1 && CODE_CH.includes(u) && joinCode.length < 4) joinCode += u; }
  if (scene === 'nick') { if (e.key === 'Backspace') { myNick = myNick.slice(0, -1); setBtns(); } else if (e.key === 'Enter') { myNick = cleanNick(myNick) || 'KURT'; saveNick(); scene = 'online'; setBtns(); } else if (e.key.length === 1 && /[A-Za-z0-9ÇĞİÖŞÜçğıöşü]/.test(e.key) && (nickFresh || myNick.length < 10)) { if (nickFresh) { myNick = ''; nickFresh = false; } myNick += e.key.toLocaleUpperCase('tr'); setBtns(); } e.preventDefault(); return; }
  if (scene === 'cut' && !e.repeat && (k === ' ' || k === 'e' || k === 'enter')) advanceCut();
  if ((k === 'e' || k === ' ') && !e.repeat) doDash();
  if (k === 'p' && !e.repeat && scene === 'play' && !net.role) paused = !paused;
  if (k.startsWith('arrow') || k === ' ') e.preventDefault();
});
window.addEventListener('keyup', e => { keys[keyOf(e)] = false; });
window.addEventListener('blur', () => { for (const k in keys) keys[k] = false; });

/* ---------- döngü ---------- */
let last = performance.now();
function loop(now) {
  const rdt = (now - last) / 1000; const dt = Math.min(.05, rdt); last = now;
  if (rdt > 0 && rdt < 1) { fpsAcc += rdt; fpsN++; if (fpsAcc > 2) { const f = fpsN / fpsAcc; if (f < 38 && !LITE) LITE = true; else if (f > 56 && LITE && fpsAcc > 6) LITE = false; fpsAcc = 0; fpsN = 0; } }
  if (scene === 'cut' && cut) { const ln = cut.lines[cut.i]; if (cut.c < ln[1].length) { const before = Math.floor(cut.c / 3); cut.c = Math.min(ln[1].length, cut.c + dt * 48); if (Math.floor(cut.c / 3) !== before && ln[0] !== 'narr') beep(ln[0] === 'wolf' ? 210 : 330 + (ln[0].length * 17) % 120, .03, 'square', .02); } }
  if (punch) { punch.t += dt; if (punch.t > .95) punch = null; }
  try {
  if (scene === 'play' || scene === 'over' || scene === 'cleared') { if (scene === 'play') { if (net.role === 'guest') guestUpdate(dt); else update(dt); } else { time += dt; parts.forEach(p => { p.x += p.vx * dt; p.y += p.vy * dt; p.life -= dt; }); parts = parts.filter(p => p.life > 0); } } else time += dt;
  netTick(dt);
  draw();
  } catch (err) { console.error(err); }
  requestAnimationFrame(loop);
}
setBtns(); requestAnimationFrame(loop);
window.__game = { startLevel, get scene() { return scene; }, get got() { return got; }, LEVELS };
